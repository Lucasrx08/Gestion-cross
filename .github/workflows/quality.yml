name: Contrôles qualité

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier TypeScript
        run: pnpm exec tsc --noEmit

      - name: Vérifier ESLint
        run: pnpm run lint

      - name: Tester les règles de course et le challenge
        run: node --import tsx scripts/race-tests.mts

      - name: Tester les imports, codes et PDF
        run: node --import tsx scripts/acceptance-tests.mts

      - name: Compiler la version GitHub Pages
        run: pnpm run build:github
        env:
          GITHUB_PAGES: "true"
