name: Déployer le générateur de dossards

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Compiler le site statique
        run: pnpm run build:github
        env:
          GITHUB_PAGES: "true"

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Préparer les fichiers à publier
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Éviter le conflit avec la publication automatique de branche
        run: node scripts/wait-pages-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publier le site
        id: deployment
        uses: actions/deploy-pages@v4
